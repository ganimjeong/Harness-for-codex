default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: harness-surface
        name: harness surface containment
        entry: scripts/surface-precommit
        language: system
        pass_filenames: false
        stages:
          - pre-commit
          - manual
      - id: harness-check
        name: harness check
        entry: scripts/check
        language: system
        pass_filenames: false
        stages:
          - pre-push
          - manual
